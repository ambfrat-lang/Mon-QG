<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon QG">
<meta name="theme-color" content="#1E3A2F">
<title>Mon QG</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Thème « Vert maquis » : bandeau vert foncé, fond ivoire, Lora + Inter ===== */
:root{
--bg:#F6F5F1;--surface:#FFFFFF;--surface2:#F1F3EE;--ink:#1B2420;--muted:#6F716C;--line:#E2E2DA;--line2:#B9BBB1;
--vertf:#1E3A2F;--accent:#1F4D3A;--rouge:#B3261E;--rouge-soft:#F8E3E1;--orange:#B26A00;--orange-soft:#F6EAD6;
--vert:#2F7A55;--vert-soft:#E1EFE6;--bleu:#2D5B8A;--bleu-soft:#E3EBF3;--violet:#6A4C93;--violet-soft:#ECE6F3;
--teal:#1F6F78;--teal-soft:#DDEFF0;--brun:#8A5A44;--brun-soft:#F2E7E1;
--display:"Lora",Georgia,serif;--body:"Inter",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.1}
h2{font-size:19px;display:flex;align-items:baseline;gap:8px;margin-top:6px}
h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
p{margin:0}

/* Bandeau */
header.top{background:var(--vertf);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 16px 18px}
header.top .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
header.top .sub{color:#A8BDB1;font-size:13px;margin-top:4px}
header.top .sync{color:#A8BDB1;font-size:11px;text-align:right;white-space:nowrap}
header.top a{color:#fff;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(48px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:14px;justify-self:start;text-decoration:none}
.note{font-size:13px;color:var(--muted)}
.vide{padding:14px 0;color:var(--muted);font-size:14px}
.empty{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);margin-bottom:4px}

/* Pastille d'espace */
.pe{display:inline-flex;align-items:center;flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--es);color:var(--ec);border:0;white-space:nowrap;line-height:1.3}
button.pe{cursor:pointer}
button.pe::after{content:"";width:0;height:0;margin-left:6px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.6}

/* Boutons */
.btn{padding:10px 16px;border:0;border-radius:999px;background:var(--vertf);color:#fff;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost{background:none;color:var(--muted);border:0;padding:10px 8px}
.btn.small{padding:7px 12px;font-size:13px;min-height:34px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .sp{flex:1}
.lien{font-size:14px;font-weight:600;text-decoration:none;color:var(--accent)}

/* À valider */
.valider{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.valider>h2{margin:0}
.prop{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px;min-width:0}
.prop:first-of-type{border-top:0;padding-top:0}
.prop .ty{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.prop .tt{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.prop .rs{font-size:14px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prop .qd{font-size:14px}
.prop .maj{font-size:13px;color:var(--orange);font-weight:600}
.choix6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.choix6 button{min-height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14px;padding:6px 4px}
.choix6 button.on{background:var(--ec);color:#fff;border-color:var(--ec)}
.choix6-l{font-size:13px;color:var(--muted)}

/* Groupes de tâches */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.grp>h3{font-family:var(--body);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 0 4px}
.grp>h3.late{color:var(--rouge)}
.row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left;min-width:0}
.grp>h3+.row{border-top:0}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t b{font-weight:500;font-size:15.5px;line-height:1.3;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .t small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.row .d.late{color:var(--rouge);font-weight:600}
.row.done b{text-decoration:line-through;color:var(--muted)}
details.plus{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.plus>summary{list-style:none;cursor:pointer;padding:13px 0;font-weight:600;display:flex;justify-content:space-between}
details.plus>summary::-webkit-details-marker{display:none}
details.plus>summary span{color:var(--muted);font-weight:500}
details.plus[open]>summary{border-bottom:1px solid var(--line)}
details.plus .row:first-of-type{border-top:0}

/* Événements */
.evts{background:var(--surface2);border-radius:14px;padding:10px 14px;display:grid;gap:6px}
.evts h3{font-family:var(--body);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ev{display:flex;gap:10px;font-size:14px;min-width:0}
.ev b{flex:none;font-weight:600;min-width:94px}
.ev span{min-width:0;overflow-wrap:anywhere}

/* Onglets (dans le bandeau vert) */
nav.views{background:var(--vertf);padding:0 16px 14px;position:sticky;top:0;z-index:6}
nav.views .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
nav.views a{position:relative;text-align:center;text-decoration:none;color:#CFDCD4;background:rgba(255,255,255,.08);font-weight:600;font-size:13px;padding:10px 2px;border-radius:99px;white-space:nowrap}
nav.views a.on{background:var(--bg);color:var(--vertf)}
nav.views a b{position:absolute;top:-6px;right:-2px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:99px;background:var(--orange);color:#fff;box-shadow:0 0 0 2px var(--vertf)}
nav.views a b:empty{display:none}
header.top{padding-bottom:12px}

/* Listes en photo : l'image entière en haut, le nom en dessous (rien ne la recouvre) */
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tuile{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);min-width:0}
.tuile .ph{aspect-ratio:4/3;background:var(--es) center/cover no-repeat;border-bottom:3px solid var(--ec)}
.tuile .cap{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:9px 11px 11px}
.tuile .cap b{font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.15}
.tuile .cap span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tuile .cap span.late{color:var(--rouge);font-weight:600}
.tuile .cap i{font-style:normal;font-size:11px;font-weight:700;background:var(--orange);color:#fff;border-radius:99px;padding:2px 7px;margin-left:4px}

/* Résumé */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px;min-width:0;text-decoration:none;color:var(--ink)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.r b{color:var(--rouge)}.stat.o b{color:var(--orange)}
.synth{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.synth h3{font-style:italic;font-weight:600;color:var(--accent);font-size:16px;margin-bottom:6px}
.synth p{font-family:var(--display);font-size:16.5px;line-height:1.55}
.synth b{font-weight:700}

/* Page d'espace */
.ehead{display:flex;align-items:center;gap:14px}
.ehead .ill{width:64px;height:64px;flex:none;border-radius:14px;background:var(--ec) center/cover no-repeat}
.ehead h1{color:var(--ink)}
.quatre{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quatre a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.quatre a.on{background:var(--vertf);border-color:var(--vertf);color:#fff}

/* Missions */
.mis{display:grid;gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;display:grid;gap:7px;width:100%;min-width:0}
.mcard .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mcard .h b{font-family:var(--display);font-size:17px;font-weight:700;overflow-wrap:anywhere}
.mcard .h span{font-size:13px;color:var(--muted);white-space:nowrap}
.mcard .h span.late{color:var(--rouge);font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--vert);border-radius:6px}
.mcard small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* Cap */
.cap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;position:relative}
.cap h3{font-family:var(--body);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cap ol,.cap ul{margin:0;padding-left:20px;display:grid;gap:6px}
.cap ol li{font-family:var(--display);font-size:16.5px;font-weight:600}
.crayon{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:grid;place-items:center;padding:0}

/* Infos */
.icard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.icard .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.icard p{overflow-wrap:anywhere}
.cat{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.cat.contact{background:var(--bleu-soft);color:var(--bleu)}.cat.idee{background:var(--orange-soft);color:var(--orange)}.cat.decision{background:var(--vert-soft);color:var(--vert)}

/* Colis et finances (Personnel) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;gap:8px;min-width:0}
.card .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .h b{font-weight:600;overflow-wrap:anywhere}
.card .h span{font-size:13px;color:var(--muted);white-space:nowrap}
.mt{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
code{font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all}

/* Fiche (tiroir) */
#veil{position:fixed;inset:0;background:rgba(27,36,32,.4);z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:620px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:88vh;overflow:auto;overflow-x:hidden}
#sheet h3{font-size:20px;overflow-wrap:anywhere;padding-right:36px}
#sheet .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);font-size:18px;line-height:1;padding:0}
#sheet label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.field{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
textarea.field{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.resume2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn.wide{width:100%;min-height:48px;font-size:16px}

/* Code d'accès */
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
.lockicon{justify-self:center;border-radius:20px;box-shadow:0 4px 14px rgba(27,36,32,.18)}
.err{color:var(--rouge);font-size:13px;min-height:18px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,120px);background:var(--vertf);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;transition:transform .25s;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:900px){
  main{max-width:860px;padding-top:24px}
  header.top .in{max-width:860px}
  #sheet{top:50%;bottom:auto;left:50%;right:auto;width:560px;transform:translate(-50%,-50%);border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(27,36,32,.25)}
  .tuiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  nav.views .in{max-width:860px}
  .mis{grid-template-columns:1fr 1fr}
  .btn:hover{filter:brightness(1.12)}
  .row:hover b{color:var(--accent)}
}
</style>
</head><body>
<div id="lock" style="display:none"><form id="lockform" autocomplete="off">
<img class="lockicon" id="lockicon" alt="" width="84" height="84"><h1>Mon QG</h1><p class="note">Entre ton code d’accès.</p>
<input class="field" id="codef" type="password" placeholder="Code" required autocomplete="current-password">
<button class="btn" type="submit">Ouvrir</button><p class="err" id="lockerr"></p>
</form></div>

<div id="app" style="display:none">
<header class="top"><div class="in"><div><h1><a href="#">Mon QG</a></h1><p class="sub" id="soustitre"></p></div><div class="sync" id="sync"></div></div></header>
<nav class="views"><div class="in"><a href="#" data-r="">Ma semaine<b id="n-semaine"></b></a><a href="#resume" data-r="resume">Résumé</a><a href="#taches" data-r="taches">Tâches<b id="n-taches"></b></a><a href="#colis" data-r="colis">Colis<b id="n-colis"></b></a></div></nav>
<main id="vue"></main>
</div>
<div id="veil" hidden></div><div id="sheet" hidden></div><div id="toast" role="status"></div>

<script>
/* Mon QG 4.0 — Ma semaine + 6 espaces. Données : Google Sheet « Mail IA – Données » via le moteur Apps Script v4.
   Rien n'est ajouté sans validation : la tâche de nuit écrit des propositions (Tâche, Événement, Info) que tu valides ici.
   Ajoute ?demo à l'adresse pour voir la démonstration. */
var MOTEUR = 'https://script.google.com/macros/s/AKfycbzFWhxasplfzpX6asZ-8Rv_St8XOiI_g6z0htOSIprmsuw1BOhu4ND0hQDZicybGlkW/exec';
var DEMO = /[?&]demo\b/.test(location.search);
var API_URL = DEMO ? '' : MOTEUR;
var APP_VERSION = '4.0.0';   // changer la version redemande le code sur chaque appareil

var ESP = {
  travail: { n: 'Travail',   c: 'var(--violet)', s: 'var(--violet-soft)', img: 'travail.jpg' },
  fac:     { n: 'Fac',       c: 'var(--bleu)',   s: 'var(--bleu-soft)',   img: '' },
  beihn:   { n: 'BeIHN',     c: 'var(--teal)',   s: 'var(--teal-soft)',   img: 'nice.jpg', pos: 'left 15%' },
  aic:     { n: 'AIC',       c: 'var(--vert)',   s: 'var(--vert-soft)',   img: 'aic.jpg' },
  these:   { n: 'Thèse',     c: 'var(--orange)', s: 'var(--orange-soft)', img: 'these.jpg' },
  perso:   { n: 'Personnel', c: 'var(--brun)',   s: 'var(--brun-soft)',   img: 'quotidien.jpg' }
};
var ORDRE = ['perso', 'beihn', 'fac', 'travail', 'aic', 'these'];          // boutons de choix (2 lignes de 3)
var TUILES = ['travail', 'fac', 'beihn', 'aic', 'these', 'perso'];        // boutons du bas de l'accueil
var ASSOS = { beihn: 1, aic: 1 };
var ANCIEN = { asso_nice: 'beihn', asso_corse: 'aic', quotidien: 'perso', maison: 'perso', perso: 'perso', travail: 'travail', fac: 'fac', these: 'these' };
var CARNET_THESE = 'https://claude.ai/artifact/CkRZgKntjb43DBAmoJvr2M';
var CAT_I = { contact: 'Contact', idee: 'Idée', decision: 'Décision', autre: 'Autre' };
var RACCOURCI = 'QG Rappels';   // raccourci iPhone : ajoute chaque ligne « titre|date|notes » à la liste de Rappels « TÂCHES »
var JC = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
var MC = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

var S = { d: null };

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function sans(s) { return String(s || '').replace(/\*\*/g, ''); }
function sur(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
function pjs(x) { return String(x || '').split(/[\s;]+/).map(sur).filter(Boolean); }
var LS = {
  get: function (k) { try { return localStorage.getItem('mm_' + k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem('mm_' + k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('mm_' + k); } catch (e) {} }
};

/* ---------- Dates ---------- */
function pd(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/) || String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (!m) return null; return m[1].length === 4 ? new Date(+m[1], m[2] - 1, +m[3], 12) : new Date(+m[3], m[2] - 1, +m[1], 12); }
function auj() { var t = new Date(); t.setHours(12, 0, 0, 0); return t; }
function ecart(s) { var d = pd(s); return d ? Math.round((d - auj()) / 864e5) : null; }
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function quand(s) { var e = ecart(s), d = pd(s); if (e === null) return ''; if (e === 0) return 'aujourd’hui'; if (e === 1) return 'demain'; if (e === -1) return 'hier'; return JC[d.getDay()] + ' ' + d.getDate() + ' ' + MC[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); }
function late(s) { var e = ecart(s); return e !== null && e < 0; }
function heure(s) { var m = String(s || '').match(/T(\d{2}):(\d{2})/); return m ? m[1] + ' h ' + m[2] : ''; }
function texteEvt(p) { var t = quand(p.evt_debut || p.echeance), h = heure(p.evt_debut), f = heure(p.evt_fin); return t + (h ? ' à ' + h : '') + (f ? ' → ' + f : ''); }

/* ---------- Moteur ---------- */
function appel(action, extra) {
  if (DEMO) return Promise.resolve(demo(action, extra || {}));
  var body = { code: LS.get('code') || '', action: action };
  for (var k in extra || {}) body[k] = extra[k];
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}
function erreurTexte(e) { return { code: 'Code incorrect.', bloque: 'Trop d’essais : réessaie dans 15 minutes.', code_non_defini: 'Aucun code défini dans le moteur.' }[e] || 'Connexion impossible.'; }
function montrerLock(msg) { $('#app').style.display = 'none'; $('#lock').style.display = 'flex'; $('#lockerr').textContent = msg || ''; $('#codef').value = ''; setTimeout(function () { $('#codef').focus(); }, 50); }
function charger(depuisLock) {
  var cache = LS.get('cache4');
  if (!depuisLock && cache && !S.d) { try { S.d = normaliser(JSON.parse(cache)); ouvrir(); } catch (e) {} }
  return appel('donnees').then(function (r) {
    if (!r.ok) { LS.del('code'); LS.del('cache4'); montrerLock(erreurTexte(r.erreur)); return; }
    S.d = normaliser(r.donnees); if (!DEMO) LS.set('cache4', JSON.stringify(S.d));
    ouvrir(); etat('À jour');
  }).catch(function () {
    if (S.d) return etat('Hors ligne');
    montrerLock('Connexion impossible. Vérifie le réseau puis réessaie.');
  });
}
function normaliser(d) {
  ['taches', 'propositions', 'evenements', 'infos', 'commandes', 'finances'].forEach(function (k) { if (!Array.isArray(d[k])) d[k] = []; });
  d.meta = d.meta || {}; d.missions = d.missions || {}; d.cap = d.cap || {};
  d.taches.forEach(function (t) { if (!ESP[t.espace]) t.espace = ANCIEN[t.categorie] || 'perso'; });
  d.propositions.forEach(function (p) { if (!ESP[p.espace]) p.espace = 'perso'; });
  d.infos.forEach(function (i) { if (!ESP[i.espace]) i.espace = 'perso'; });
  return d;
}
function ouvrir() { $('#lock').style.display = 'none'; $('#app').style.display = 'block'; rendre(); }
function etat(t) { $('#sync').textContent = t; }
function agir(action, extra, local) {
  if (local) { local(); rendre(); }
  return appel(action, extra).then(function (r) { if (!r || !r.ok) throw r; return r; })
    .catch(function () { toast('Non enregistré : vérifie la connexion.'); charger(); return null; });
}
function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { el.classList.remove('on'); }, 2400); }
function trouver(liste, id) { return S.d[liste].filter(function (x) { return String(x.id) === String(id); })[0]; }

/* ---------- Modèle ---------- */
function ouvertes(esp) { return S.d.taches.filter(function (t) { return t.statut !== 'fait' && (!esp || t.espace === esp); }); }
function props(esp) { return S.d.propositions.filter(function (p) { return !esp || p.espace === esp; }); }
function byEch(a, b) { var x = ecart(a.echeance), y = ecart(b.echeance); return (x === null ? 9e4 : x) - (y === null ? 9e4 : y); }
function mission(esp, id) { return ((S.d.missions || {})[esp] || []).filter(function (m) { return m.id === id; })[0]; }
function pe(esp, act, id) {
  var e = ESP[esp] || ESP.perso, st = 'style="--ec:' + e.c + ';--es:' + e.s + '"';
  return act ? '<button class="pe" ' + st + ' data-act="' + act + '" data-id="' + esc(id) + '" aria-label="Espace : ' + e.n + '. Changer">' + e.n + '</button>' : '<span class="pe" ' + st + '>' + e.n + '</span>';
}

/* Groupes : En retard / Aujourd'hui et demain / Cette semaine / Semaine prochaine / Ce mois-ci ; au-delà ou sans date : Plus tard */
function grouper(l) {
  var t = auj(), dow = (t.getDay() + 6) % 7;            // lundi = 0
  var finSem = 6 - dow, finSuiv = finSem + 7;
  var G = [['late', 'En retard', []], ['proche', 'Aujourd’hui et demain', []], ['sem', 'Cette semaine', []], ['suiv', 'Semaine prochaine', []], ['mois', 'Ce mois-ci', []]], plus = [];
  l.slice().sort(byEch).forEach(function (x) {
    var e = ecart(x.echeance);
    if (e === null || e > 30) plus.push(x);
    else if (e < 0) G[0][2].push(x);
    else if (e <= 1) G[1][2].push(x);
    else if (e <= finSem) G[2][2].push(x);
    else if (e <= finSuiv) G[3][2].push(x);
    else G[4][2].push(x);
  });
  return { g: G.filter(function (g) { return g[2].length; }), plus: plus };
}
function ligne(t, avecEspace, sansMission) {
  var m = ASSOS[t.espace] && t.mission && !sansMission ? mission(t.espace, t.mission) : null;
  var sous = m ? m.nom : (!avecEspace && t.domaine ? t.domaine : '');
  return '<button class="row' + (t.statut === 'fait' ? ' done' : '') + '" data-act="voir" data-id="' + esc(t.id) + '">'
    + (avecEspace ? pe(t.espace) : '')
    + '<span class="t"><b>' + esc(t.titre) + '</b>' + (sous ? '<small>' + esc(sous) + '</small>' : '') + '</span>'
    + (t.echeance ? '<span class="d' + (late(t.echeance) && t.statut !== 'fait' ? ' late' : '') + '">' + quand(t.echeance) + '</span>' : '') + '</button>';
}
function blocTaches(l, avecEspace, videTxt) {
  var r = grouper(l), h = '';
  r.g.forEach(function (g) { h += '<section class="grp"><h3 class="' + (g[0] === 'late' ? 'late' : '') + '">' + g[1] + '</h3>' + g[2].map(function (t) { return ligne(t, avecEspace); }).join('') + '</section>'; });
  if (!r.g.length) h += '<div class="empty"><b>Rien dans les 30 prochains jours</b>' + (videTxt || '') + '</div>';
  if (r.plus.length) h += '<details class="plus"><summary>Plus tard<span>' + r.plus.length + '</span></summary>' + r.plus.map(function (t) { return ligne(t, avecEspace); }).join('') + '</details>';
  return h;
}

/* ---------- Bloc « À valider » ---------- */
function blocValider(esp) {
  var l = props(esp);
  if (!l.length) return '';
  var ordre = { tache: 0, evenement: 1, info: 2 };
  l.sort(function (a, b) { return (ordre[a.type] - ordre[b.type]) || byEch(a, b); });
  return '<section class="valider"><h2>À valider<small>' + l.length + '</small></h2>' + l.map(carteProp).join('') + '</section>';
}
function carteProp(p) {

  var incertain = p.certitude === 'incertain';
  var h = '<article class="prop" data-prop="' + esc(p.id) + '"><div class="ty">' + lib + (incertain ? '' : pe(p.espace, 'p-espace', p.id)) + '</div>';
  if (incertain) h += '<div class="choix6-l">Quel espace ?</div><div class="choix6">' + ORDRE.map(function (k) {
    return '<button data-act="p-choix" data-id="' + esc(p.id) + '" data-v="' + k + '" class="' + (k === p.espace ? 'on' : '') + '" style="--ec:' + ESP[k].c + '">' + ESP[k].n + '</button>';
  }).join('') + '</div>';
  var cible = p.tache_id ? trouver('taches', p.tache_id) : null;
  if (cible) h += '<div class="maj">Mise à jour de « ' + esc(cible.titre) + ' »</div>';

  if (p.type === 'evenement') h += '<div class="qd">📅 <b>' + texteEvt(p) + '</b>' + (p.evt_lieu ? ' · ' + esc(p.evt_lieu) : '') + '</div>';
  else if (p.type === 'tache' && p.echeance) h += '<div class="qd">Pour <b class="' + (late(p.echeance) ? 'late' : '') + '">' + quand(p.echeance) + '</b></div>';
  if (p.type === 'tache' && ASSOS[p.espace] && p.mission && mission(p.espace, p.mission)) h += '<div class="note">Mission : ' + esc(mission(p.espace, p.mission).nom) + '</div>';

  else if (p.type === 'evenement') h += '<button class="btn" data-act="p-ok" data-id="' + esc(p.id) + '">Ajouter au calendrier</button><button class="btn light" data-act="p-modif" data-id="' + esc(p.id) + '">Modifier</button>';

    + (sur(p.lien) ? '<a class="lien" href="' + esc(sur(p.lien)) + '" target="_blank" rel="noopener">Mail</a>' : '') + '</div></article>';
  return h;
}

/* ---------- Onglet Résumé ---------- */

}
function rendreEspace(k, onglet) {

  if (ASSOS[k]) {

    h += '<nav class="quatre">' + [['taches', 'Tâches'], ['missions', 'Missions'], ['cap', 'Lignes directrices'], ['infos', 'Infos à noter']].map(function (o) {

function progression(k, m) {

}
function rendreMissions(k) {

  var enc = ms.filter(function (m) { return m.statut !== 'terminee'; }), fin = ms.filter(function (m) { return m.statut === 'terminee'; });
  var h = '<div class="mis">' + enc.map(carte).join('') + '</div>';

  return h;

function byEchM(a, b) { return byEch(a, b); }
function voirMission(k, id) {

function lienSuivi(c) {
